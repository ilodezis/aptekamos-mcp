services:
  aptekamos-mcp:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: aptekamos-mcp
    env_file: .env
    ports:
      # Loopback only: the reverse proxy terminates TLS and forwards here.
      - "127.0.0.1:${HOST_PORT:-8130}:8130"
    restart: unless-stopped
